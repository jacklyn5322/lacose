<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>收藏完成｜三份驚喜禮物</title><link rel="stylesheet" href="assets/site.css"><script src="assets/global-reset.js?v=5.11.0" defer></script></head><body class="theme-gift"><main class="page"><header class="topbar"><a class="nav" href="index.html">⌂</a><div class="brand">已收藏的驚喜</div><a class="nav" href="../index.html">↗</a></header><section class="content"><div class="tag">A MEMORY TO KEEP</div><h1>三份心意，完整收藏</h1><p class="lead">這段回憶已經保存在雲端。下次從任何裝置進入，都會直接回到這一頁。</p><div id="giftList"></div><div class="card"><h2>最後想對你說</h2><p id="finalMeaning" class="gift-meaning"></p></div><div class="actions"><a class="btn secondary" href="index.html">返回本章首頁</a></div></section></main><script src="assets/app.js"></script><script src="assets/cloud.js?v=5.11.0"></script><script>
(async()=>{const el=document.getElementById('giftList');try{const d=await Chapter02Cloud.loadState();if(!d.giftFlowCompleted){location.replace('gift-upload.html?n=0');return}el.innerHTML=d.gifts.map((g,i)=>{const m=g.photo;let media=Chapter02Cloud.canPreviewImage(m)?`<img class="gift-image" src="${m.url}" alt="${esc(m.name)}">`:m.mimeType?.startsWith('video/')?`<video class="gift-image" controls src="${m.url}"></video>`:`<div class="notice">瀏覽器不支援直接預覽此檔案。</div>`;return `<article class="card"><div class="gift-step">SURPRISE ${i+1} / 3</div><h2>${esc(g.name)}</h2>${media}<p class="small"><a href="${Chapter02Cloud.mediaUrl(m,true)}">下載／開啟原始檔案：${esc(m.name)}</a></p><p class="gift-meaning">${esc(g.meaning)}</p></article>`}).join('');el.querySelectorAll('img.gift-image').forEach((image,index)=>image.addEventListener('error',()=>{const gift=d.gifts[index],m=gift.photo;image.replaceWith(Object.assign(document.createElement('div'),{className:'notice',textContent:'此瀏覽器無法直接預覽這種原始照片格式；原始檔案仍可下載／開啟。'}));},{once:true}));document.getElementById('finalMeaning').textContent=Chapter02Cloud.FINAL_MEANING}catch(e){el.textContent='無法讀取已完成的雲端回憶：'+e.message}})();
</script></body></html>
