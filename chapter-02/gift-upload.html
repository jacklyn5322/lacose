<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>上傳禮物照片</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="page"><header class="topbar"><a class="nav" href="index.html">⌂</a><div class="brand">今日的驚喜禮物</div><button class="nav" onclick="back()">‹</button></header><section class="content"><div class="tag">THREE LITTLE SURPRISES</div><h1 id="heading">先上傳這份禮物的照片</h1><p class="lead">選擇手機相簿裡的照片，不會開啟相機。上傳完成後，下一頁才會揭曉自拍與禮物意義。</p><div class="card"><div class="gift-step" id="step"></div><div class="field"><label for="giftPhoto">從相簿選擇禮物照片</label><input type="file" id="giftPhoto" accept="image/*"><img id="preview" class="photo-preview hidden" alt="禮物照片預覽"></div><button class="btn" id="continue">保存照片並揭曉 →</button></div><a class="btn secondary" href="index.html">返回首頁</a></section></main><script src="assets/app.js"></script><script>const d=load(),q=new URLSearchParams(location.search),idx=Math.max(0,Math.min(2,Number(q.get('n')||0)));if(idx>0&&!d.gifts?.[idx-1]?.revealed){location.replace('gift-upload.html?n='+Math.max(0,idx-1))}const input=document.getElementById('giftPhoto'),img=document.getElementById('preview');document.getElementById('step').textContent=`SURPRISE ${idx+1} / 3`;document.getElementById('heading').textContent=`第 ${idx+1} 份禮物｜先上傳照片`;const old=d.gifts?.[idx]?.giftPhoto;if(old){img.src=old;img.classList.remove('hidden')}preview(input,img);document.getElementById('continue').onclick=()=>{const file=input.files[0],go=src=>{if(!src&&!old){alert('請先選擇一張禮物照片');return}d.gifts=d.gifts||[];d.gifts[idx]=d.gifts[idx]||{};if(src)d.gifts[idx].giftPhoto=src;save(d);location.href='gift-reveal.html?n='+idx};if(file)readFile(file,go);else go(null)};</script></body></html>
