<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>上傳禮物照片</title><link rel="stylesheet" href="assets/site.css"><script src="assets/global-reset.js?v=5.9.0" defer></script></head><body class="theme-gift"><main class="page"><header class="topbar"><a class="nav" href="index.html">⌂</a><div class="brand">今日的驚喜禮物</div><a class="nav" href="../index.html">↗</a></header><section class="content"><div class="tag">THREE LITTLE SURPRISES</div><h1 id="heading">先與禮物合照</h1><p class="lead">請選擇你與這份禮物的合照。原始檔案會直接保存到 Google Drive，不會壓縮或轉檔。</p><div class="card"><div class="gift-step" id="step"></div><h2 id="giftName"></h2><div class="field"><label for="giftPhoto">選擇合照（支援 iPhone 照片、RAW、影片及其他檔案）</label><input type="file" id="giftPhoto" accept="*/*"><div id="preview"></div></div><div id="status" class="upload-status"></div><button class="btn" id="continue">上傳並前往禮物意涵 →</button></div><a class="btn secondary" href="index.html">返回本章首頁</a></section></main><script src="assets/cloud.js?v=5.9.0"></script><script>
const $=id=>document.getElementById(id),idx=Math.max(0,Math.min(2,Number(new URLSearchParams(location.search).get('n')||0)));let state,chosen=null;
function showPreview(file){const el=$('preview');el.innerHTML='';if(Chapter02Cloud.canPreviewImage(file)){const img=document.createElement('img');img.className='photo-preview';img.alt='合照預覽';img.src=URL.createObjectURL(file);el.appendChild(img)}else if(file.type.startsWith('video/')){const video=document.createElement('video');video.controls=true;video.className='photo-preview';video.src=URL.createObjectURL(file);el.appendChild(video)}else{el.textContent='此格式會以原始檔案保存；瀏覽器可能無法直接預覽。'}}
(async()=>{try{state=await Chapter02Cloud.loadState();if(state.giftFlowCompleted){location.replace('gift-complete.html');return}if(idx>0&&!state.gifts[idx-1].photo){location.replace('gift-upload.html?n='+(idx-1));return}$('step').textContent='SURPRISE '+(idx+1)+' / 3';$('giftName').textContent=Chapter02Cloud.DEFINITIONS[idx].name;const old=state.gifts[idx].photo;if(old){$('status').textContent='這份禮物已經有雲端照片：'+old.name+'。如需更換，可重新選擇檔案。';if(Chapter02Cloud.canPreviewImage(old))$('preview').innerHTML=`<img class="photo-preview" src="${old.url}" alt="已保存的合照">`;else $('preview').innerHTML=`<a href="${old.downloadUrl}">下載／開啟已保存的原始檔案：${esc(old.name)}</a>`}}catch(e){$('status').textContent='雲端讀取失敗：'+e.message}})();
$('giftPhoto').addEventListener('change',()=>{chosen=$('giftPhoto').files[0]||null;if(chosen){showPreview(chosen);$('status').textContent='已選擇 '+chosen.name+'（'+(chosen.size/1048576).toFixed(1)+' MB）'}});
$('continue').onclick=async()=>{const btn=$('continue');btn.disabled=true;try{let photo=state?.gifts?.[idx]?.photo;if(chosen){photo=await Chapter02Cloud.uploadFile(chosen,p=>$('status').textContent='正在保存原始合照 '+p+'%')}if(!photo)throw new Error('請先選擇你與禮物的合照。');$('status').textContent='照片已上傳，正在保存這份禮物的雲端進度……';await Chapter02Cloud.saveGift(idx,photo);location.href='gift-reveal.html?n='+idx}catch(e){$('status').textContent='無法繼續：'+e.message;btn.disabled=false}};
</script></body></html>
