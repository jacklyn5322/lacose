<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf2e3"><title>今日旅程｜台南・即興冒險</title><link rel="stylesheet" href="assets/site.css"><script src="assets/global-reset.js?v=5.8.0" defer></script></head><body class="theme-journey"><main class="page"><header class="topbar"><a class="nav" href="index.html" aria-label="返回本章首頁">⌂</a><div class="brand">今日旅程</div><a class="nav" href="../index.html" aria-label="返回共同首頁">↗</a></header><section class="content"><div class="tag">FOLLOW THE MOMENT</div><h1>下一站，去哪裡？</h1><p class="lead">輸入現在所在的景點或店家，AI 會依照地點與補充資訊，產生三種不同的專屬任務。</p><form id="placeForm" class="card"><div class="field"><label for="place">📍 景點／店家名稱</label><input id="place" required maxlength="100" placeholder="例如：赤崁樓、神農街、咖啡店"></div><div class="field"><label for="note">當下想記下的事（選填）</label><textarea id="note" maxlength="500" placeholder="現場感受、想找的特色、臨時發現……"></textarea></div><button class="btn" id="startJourney" type="submit">生成專屬任務 →</button><div id="status" class="upload-status" role="status" aria-live="polite"></div></form><div class="card"><h2>今天走過的地方</h2><div id="placeList">正在讀取雲端旅程……</div></div><div class="actions"><a class="btn secondary" href="album.html">查看回憶相簿</a></div></section></main><script src="assets/app.js"></script><script src="assets/cloud.js?v=5.8.0"></script><script>
const $=id=>document.getElementById(id);let state;
function render(){const el=$('placeList');el.innerHTML=state.places.length?state.places.map((p,i)=>`<div class="entry"><b>${i+1}. ${esc(p.name||p.place)}</b><div class="small">${new Date(p.createdAt).toLocaleString('zh-TW')}</div><div>${esc(p.note||'')}</div></div>`).join(''):'<div class="empty">尚未記錄地點，新增第一站吧！</div>'}
(async()=>{try{state=await Chapter02Cloud.loadState();render()}catch(e){$('placeList').textContent='雲端讀取失敗：'+e.message}})();
$('placeForm').addEventListener('submit',async e=>{e.preventDefault();const place=$('place').value.trim(),note=$('note').value.trim(),btn=$('startJourney');if(!place)return;btn.disabled=true;$('status').textContent='正在連接 Gemini，依照地點產生三種任務……';try{const result=await Chapter02Cloud.generateTasks(place,note);const record={id:crypto.randomUUID(),name:place,note,createdAt:new Date().toISOString(),tasks:result.tasks,sources:result.sources||[],media:[],answer:''};await Chapter02Cloud.saveJourney(record);sessionStorage.setItem('ch2_current_journey',record.id);$('status').textContent='AI 已產生三種任務並保存到雲端。'+(result.grounded?'已參考 Google 搜尋資料。':'本次沒有取得可引用的搜尋來源。');location.href='game.html?id='+encodeURIComponent(record.id)}catch(err){$('status').textContent='任務產生失敗：'+err.message+'。請確認後端 Vertex AI 權限及服務設定後再試。';btn.disabled=false}});
</script></body></html>
