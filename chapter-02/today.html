<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf2e3"><title>今日旅程｜台南・即興冒險</title><link rel="stylesheet" href="assets/site.css"><script src="assets/global-reset.js?v=5.6.4" defer></script></head><body><main class="page"><header class="topbar"><a class="nav" href="index.html" aria-label="返回首頁">⌂</a><div class="brand">今日旅程</div><button class="nav" onclick="back()" aria-label="返回上一頁">‹</button></header><section class="content"><div class="tag">FOLLOW THE MOMENT</div><h1>下一站，去哪裡？</h1><p class="lead">不用預先安排路線。每到一個地方，就記下這一站，開始新的探索。</p><form id="placeForm" class="card"><div class="field"><label for="place">📍 景點／店家名稱</label><input id="place" required maxlength="100" placeholder="例如：赤崁樓、神農街、咖啡店"></div><div class="field"><label for="note">當下想記下的事（選填）</label><textarea id="note" maxlength="500" placeholder="現場感受、想找的特色、臨時發現……"></textarea></div><button class="btn" id="startJourney" type="submit">記錄這一站並開始闖關 →</button></form><div class="card"><h2>今天走過的地方</h2><div id="placeList"></div></div><div class="actions"><a class="btn secondary" href="album.html">查看回憶相簿</a></div><div class="notice">AI 即時生成與網路搜尋尚未連接正式服務。此版本先提供任務流程測試，不會把固定示範任務冒稱為 AI 結果。</div></section></main><script src="assets/app.js"></script><script>const d=load();function render(){const el=document.getElementById('placeList');el.innerHTML=d.places.length?d.places.map((p,i)=>`<div class="entry"><b>${i+1}. ${esc(p.name)}</b><div class="small">${new Date(p.createdAt).toLocaleString('zh-TW')}</div><div>${esc(p.note||'')}</div></div>`).join(''):'<div class="empty">尚未記錄地點，新增第一站吧！</div>'}render();document.getElementById('placeForm').addEventListener('submit',e=>{e.preventDefault();const p={id:Date.now().toString(),name:document.getElementById('place').value.trim(),note:document.getElementById('note').value.trim(),createdAt:new Date().toISOString(),tasks:[],photos:[]};if(!p.name)return;const btn=document.getElementById('startJourney');btn.disabled=true;btn.textContent='正在建立這一站…';d.places.push(p);try{save(d);location.href='game.html?id='+encodeURIComponent(p.id)}catch(err){d.places.pop();btn.disabled=false;btn.textContent='記錄這一站並開始闖關 →';alert('目前瀏覽器儲存空間不足，請先減少照片資料後再試。')}})</script></body></html>
