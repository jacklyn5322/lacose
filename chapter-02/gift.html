<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf2e3"><title>今日的驚喜禮物｜台南・即興冒險</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="page"><header class="topbar"><a class="nav" href="index.html" aria-label="返回首頁">⌂</a><div class="brand">今日的驚喜禮物</div><button class="nav" onclick="back()" aria-label="返回上一頁">‹</button></header><section class="content"><div class="tag">THREE LITTLE SURPRISES</div><h1>一份一份，慢慢揭曉</h1><p class="lead">每完成一份禮物的合照與文字，再前往下一份。</p><div class="card"><div class="gift-step" id="step"></div><h2 id="giftTitle"></h2><p id="giftMeaning" class="lead">禮物的意義尚未填寫，請由管理者補上。</p><div class="field"><label for="giftPhoto">與這份禮物的合照</label><input type="file" id="giftPhoto" accept="image/*" capture="environment"><img id="giftPreview" class="photo-preview hidden" alt="禮物合照預覽"></div><div class="actions"><button class="btn" id="next">保存並前往下一份</button><button class="btn secondary hidden" id="finish">完成三份禮物</button></div></div><div class="small">禮物名稱與意義目前留空，請在獨立管理資料中填入你的實際內容。</div></section></main><script src="assets/app.js"></script><script>const d=load();let idx=0;const titles=['第一份禮物','第二份禮物','第三份禮物'];function draw(){document.getElementById('step').textContent=`SURPRISE ${idx+1} / 3`;document.getElementById('giftTitle').textContent=titles[idx];const g=(d.gifts||[])[idx]||{};document.getElementById('giftMeaning').textContent=g.meaning||'這份禮物的意義，等待你在管理後台填寫。';const img=document.getElementById('giftPreview');if(g.photo){img.src=g.photo;img.classList.remove('hidden')}else{img.removeAttribute('src');img.classList.add('hidden')}document.getElementById('next').classList.toggle('hidden',idx===2);document.getElementById('finish').classList.toggle('hidden',idx!==2)}preview(document.getElementById('giftPhoto'),document.getElementById('giftPreview'));function persist(done){const f=document.getElementById('giftPhoto').files[0];const saveOne=src=>{d.gifts=d.gifts||[];d.gifts[idx]=d.gifts[idx]||{};if(src)d.gifts[idx].photo=src;save(d);done()};if(f)readFile(f,saveOne);else saveOne(null)}document.getElementById('next').onclick=()=>persist(()=>{idx++;document.getElementById('giftPhoto').value='';draw()});document.getElementById('finish').onclick=()=>persist(()=>{alert('三份禮物已保存。');location.href='index.html'});draw();</script></body></html>
