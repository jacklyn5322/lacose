<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>禮物揭曉</title><link rel="stylesheet" href="assets/site.css"><script src="assets/global-reset.js?v=5.11.0" defer></script></head><body class="theme-gift"><main class="page"><header class="topbar"><a class="nav" href="index.html">⌂</a><div class="brand">禮物揭曉</div><a class="nav" href="../index.html">↗</a></header><section class="content"><div class="tag">A LITTLE SURPRISE</div><h1 id="title">這份禮物的故事</h1><div class="card"><div class="gift-step" id="step"></div><h2 id="giftName"></h2><div id="photo"></div><h2>這份禮物的意義</h2><p id="meaning" class="gift-meaning"></p><button class="btn" id="next">前往下一份禮物 →</button><button class="btn hidden" id="finish">完成三份禮物，收藏這段回憶</button></div></section></main><script src="assets/app.js"></script><script src="assets/cloud.js?v=5.11.0"></script><script>
const $=id=>document.getElementById(id),idx=Math.max(0,Math.min(2,Number(new URLSearchParams(location.search).get('n')||0)));
(async()=>{try{const d=await Chapter02Cloud.loadState();if(d.giftFlowCompleted){location.replace('gift-complete.html');return}const gift=d.gifts[idx];if(!gift.photo){location.replace('gift-upload.html?n='+idx);return}if(idx>0&&!d.gifts[idx-1].photo){location.replace('gift-upload.html?n='+(idx-1));return}$('step').textContent='SURPRISE '+(idx+1)+' / 3';$('title').textContent='第 '+(idx+1)+' 份禮物，揭曉';$('giftName').textContent=gift.name;$('meaning').textContent=gift.meaning;const m=gift.photo;if(Chapter02Cloud.canPreviewImage(m))$('photo').innerHTML=`<img class="gift-image" src="${m.url}" alt="${esc(m.name)}"><p class="small">${esc(m.name)}</p><a href="${m.downloadUrl}">若無法預覽，下載／開啟原始檔案</a>`;else if(m.mimeType?.startsWith('video/'))$('photo').innerHTML=`<video class="gift-image" controls src="${m.url}"></video><p class="small">${esc(m.name)}</p><a href="${m.downloadUrl}">下載／開啟原始影片</a>`;else $('photo').innerHTML=`<div class="notice">此檔案已完整保存在雲端，瀏覽器不支援直接預覽。</div><a href="${m.downloadUrl||Chapter02Cloud.mediaUrl(m,true)}">下載／開啟原始檔案：${esc(m.name)}</a>`;const giftImage=$('photo').querySelector('img.gift-image');if(giftImage)giftImage.addEventListener('error',()=>{$('photo').innerHTML='<div class="notice">此瀏覽器無法直接預覽這種原始照片格式，原始檔案仍完整保存在雲端。</div><a href="'+m.downloadUrl+'">下載／開啟原始檔案：'+esc(m.name)+'</a>'},{once:true});if(idx===2){$('next').classList.add('hidden');$('finish').classList.remove('hidden')}}catch(e){$('meaning').textContent='讀取雲端禮物失敗：'+e.message}})();
$('next').onclick=()=>location.href='gift-upload.html?n='+(idx+1);
$('finish').onclick=async()=>{const b=$('finish');b.disabled=true;try{await Chapter02Cloud.completeGifts();location.href='gift-complete.html'}catch(e){$('meaning').textContent='完成狀態保存失敗：'+e.message;b.disabled=false}};
</script></body></html>
