<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>禮物揭曉</title><link rel="stylesheet" href="assets/site.css"><script src="assets/global-reset.js?v=5.6.4" defer></script></head><body><main class="page"><header class="topbar"><a class="nav" href="index.html">⌂</a><div class="brand">禮物揭曉</div><button class="nav" onclick="back()">‹</button></header><section class="content"><div class="tag">A LITTLE SURPRISE</div><h1 id="title">這份禮物的故事</h1><div class="card"><div class="gift-step" id="step"></div><h2 id="giftName"></h2><img id="giftPhoto" class="photo-preview" alt="已上傳的禮物照片"><h2>和禮物的自拍</h2><div class="field"><label for="selfie">上傳與禮物的自拍（從相簿選擇）</label><input type="file" id="selfie" accept="image/*"><img id="selfiePreview" class="photo-preview hidden" alt="自拍預覽"></div><h2>這份禮物的意義</h2><p id="meaning" class="lead">尚未由管理者填寫。</p><button class="btn" id="next">保存並前往下一份 →</button><button class="btn secondary hidden" id="finish">完成三份禮物</button></div></section></main><script src="assets/app.js"></script><script>const d=load(),idx=Math.max(0,Math.min(2,Number(new URLSearchParams(location.search).get('n')||0))),g=d.gifts?.[idx]||{};if(!g.giftPhoto||(idx>0&&!d.gifts?.[idx-1]?.revealed)){location.replace('gift-upload.html?n='+idx)}document.getElementById('step').textContent=`SURPRISE ${idx+1} / 3`;document.getElementById('title').textContent=`第 ${idx+1} 份禮物，揭曉`;document.getElementById('giftName').textContent=g.name||`第 ${idx+1} 份禮物`;document.getElementById('meaning').textContent=g.meaning||'這份禮物的意義尚未由管理者填寫。';if(g.giftPhoto)document.getElementById('giftPhoto').src=g.giftPhoto;const input=document.getElementById('selfie'),img=document.getElementById('selfiePreview');if(g.selfie){img.src=g.selfie;img.classList.remove('hidden')}preview(input,img);const next=document.getElementById('next'),finish=document.getElementById('finish');next.classList.toggle('hidden',idx===2);finish.classList.toggle('hidden',idx!==2);function persist(done){const file=input.files[0],saveIt=src=>{d.gifts=d.gifts||[];d.gifts[idx]=d.gifts[idx]||{};if(src)d.gifts[idx].selfie=src;d.gifts[idx].revealed=true;save(d);done()};if(file)readFile(file,saveIt);else if(g.selfie||confirm('尚未上傳自拍，仍要繼續嗎？'))saveIt(null)}next.onclick=()=>persist(()=>location.href='gift-upload.html?n='+(idx+1));finish.onclick=()=>persist(()=>{d.giftFlowCompleted=true;save(d);alert('三份禮物流程完成！');location.href='index.html'});</script></body></html>
