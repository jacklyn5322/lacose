<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf1df"><title>決定下一站｜台南旅程</title>
<style>
:root{--paper:#fbf1df;--ink:#765239;--line:#d8bd9c;--coral:#d97861;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html{background:var(--paper);-webkit-text-size-adjust:100%}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;min-height:100vh;min-height:100svh}button,input,textarea{font:inherit}.page{max-width:560px;margin:auto;min-height:100svh;padding-bottom:calc(22px + var(--safe));overflow:hidden;background:linear-gradient(#fbf2e2,#f8edda)}header{height:58px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}.nav{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#fff9ef;color:var(--ink);font-size:23px;text-decoration:none;display:grid;place-items:center}.brand{font-size:14px;font-weight:750;letter-spacing:.08em}.hero img{display:block;width:100%;height:auto}.hero-copy{text-align:center;padding:4px 20px 18px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#a77c55}h1{font-size:36px;letter-spacing:.12em;margin:4px 0 10px;font-weight:850}.intro{font-size:15px;line-height:1.8;margin:0}.card{margin:0 16px;padding:22px 18px 18px;border:2px dashed #d7b68e;border-radius:24px;background:rgba(255,250,240,.86)}label{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:750;margin:0 0 10px}input,textarea{width:100%;border:1.5px solid var(--line);border-radius:16px;background:#fffdf8;color:var(--ink);padding:15px 14px;font-size:16px;outline:none}input{min-height:54px}textarea{min-height:94px;resize:vertical;line-height:1.65}input::placeholder,textarea::placeholder{color:#b8a48e}input:focus,textarea:focus{border-color:#c47b5d;box-shadow:0 0 0 3px #c47b5d24}.field+.field{margin-top:22px}.counter{text-align:right;color:#a58a70;font-size:12px;margin-top:5px}.hint{display:flex;gap:10px;margin:18px 2px 2px;font-size:13px;line-height:1.7;color:#8a6847}.submit-wrap{padding:20px 22px 0}.submit{width:100%;min-height:60px;border:2px solid #b85f4b;border-radius:999px;background:var(--coral);color:#fffaf1;font-size:18px;font-weight:800;box-shadow:inset 0 0 0 2px #ffffff66,0 4px 0 #b85f4b}.submit:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px #ffffff66,0 2px 0 #b85f4b}.message{display:none;margin:14px 18px 0;padding:12px 14px;border-radius:14px;background:#fff9ef;border:1px solid var(--line);font-size:14px;line-height:1.65}.message.show{display:block}footer{text-align:center;color:#a58a70;font-size:12px;letter-spacing:.08em;margin:22px 0 0}@media(min-width:561px){body{padding:18px 0}.page{border-radius:20px;box-shadow:0 10px 40px #5c412a1f}}
</style><script src="assets/global-reset.js?v=5.6.4" defer></script></head><body><main class="page"><header><a class="nav" href="index.html" aria-label="返回首頁">‹</a><div class="brand">台南旅程 ✿</div><a class="nav" href="index.html" aria-label="回到首頁">⌂</a></header>
<section class="hero"><img src="assets/destination-illustration.jpg" alt="台南手繪街景、廟宇、老街與旅人插畫"><div class="hero-copy"><div class="eyebrow">OUR NEXT LITTLE STOP</div><h1>決定下一站</h1><p class="intro">輸入你現在所在的景點或店家，<br>讓 AI 為你生成專屬的旅程任務！</p></div></section>
<form id="form" novalidate><section class="card"><div class="field"><label for="place">📍 目前所在景點／店家</label><input id="place" type="text" maxlength="80" autocomplete="off" placeholder="例如：赤崁樓、國華街、某某咖啡廳" required></div><div class="field"><label for="notes">💬 補充說明（選填）</label><textarea id="notes" maxlength="100" placeholder="例如：想找特色小吃、想拍照、喜歡文青風……"></textarea><div class="counter"><span id="count">0</span> / 100</div></div><div class="hint"><span>☀</span><span>不用預先安排下一站，只要輸入當下位置，就能開始探索！</span></div></section><div class="submit-wrap"><button class="submit" type="submit">生成我的旅程任務　→</button></div><div class="message" id="message" role="status" aria-live="polite"></div></form><footer>TAKE IT SLOW · ENJOY THE JOURNEY</footer></main>
<script src="assets/app.js"></script><script src="assets/cloud.js?v=5.7.0"></script><script>const n=document.getElementById('notes'),c=document.getElementById('count'),p=document.getElementById('place'),m=document.getElementById('message');n.addEventListener('input',()=>c.textContent=String(n.value.length));document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const place=p.value.trim(),note=n.value.trim(),button=e.submitter;if(!place){m.textContent='先輸入目前所在的景點或店家，我們就可以開始囉！';m.classList.add('show');p.focus();return;}button.disabled=true;m.textContent='正在連接 Gemini 產生專屬任務……';m.classList.add('show');try{const result=await Chapter02Cloud.generateTasks(place,note);const record={id:crypto.randomUUID(),name:place,note,createdAt:new Date().toISOString(),tasks:result.tasks,sources:result.sources||[],media:[],answer:''};await Chapter02Cloud.saveJourney(record);location.href='game.html?id='+encodeURIComponent(record.id)}catch(error){m.textContent='AI 任務產生失敗：'+error.message;button.disabled=false}});</script></body></html>
