<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf1df"><title>決定下一站｜台南旅程</title><link rel="stylesheet" href="assets/site.css">
<script src="assets/global-reset.js?v=5.8.0" defer></script></head><body class="theme-journey"><main class="page"><header class="topbar"><a class="nav" href="index.html" aria-label="返回首頁">‹</a><div class="brand">台南旅程 ✿</div><a class="nav" href="index.html" aria-label="回到首頁">⌂</a></header>
<section class="hero"><img src="assets/destination-illustration.jpg" alt="台南手繪街景、廟宇、老街與旅人插畫"><div class="hero-copy"><div class="eyebrow">OUR NEXT LITTLE STOP</div><h1>決定下一站</h1><p class="intro">輸入你現在所在的景點或店家，<br>讓 AI 為你生成專屬的旅程任務！</p></div></section>
<form id="form" novalidate><section class="card"><div class="field"><label for="place">📍 目前所在景點／店家</label><input id="place" type="text" maxlength="80" autocomplete="off" placeholder="例如：赤崁樓、國華街、某某咖啡廳" required></div><div class="field"><label for="notes">💬 補充說明（選填）</label><textarea id="notes" maxlength="100" placeholder="例如：想找特色小吃、想拍照、喜歡文青風……"></textarea><div class="counter"><span id="count">0</span> / 100</div></div><div class="hint"><span>☀</span><span>不用預先安排下一站，只要輸入當下位置，就能開始探索！</span></div></section><div class="submit-wrap"><button class="submit btn" type="submit">生成我的旅程任務　→</button></div><div class="message" id="message" role="status" aria-live="polite"></div></form><footer>TAKE IT SLOW · ENJOY THE JOURNEY</footer></main>
<script src="assets/app.js"></script><script src="assets/cloud.js?v=5.8.0"></script><script>const n=document.getElementById('notes'),c=document.getElementById('count'),p=document.getElementById('place'),m=document.getElementById('message');n.addEventListener('input',()=>c.textContent=String(n.value.length));document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const place=p.value.trim(),note=n.value.trim(),button=e.submitter;if(!place){m.textContent='先輸入目前所在的景點或店家，我們就可以開始囉！';m.classList.add('show');p.focus();return;}button.disabled=true;m.textContent='正在連接 Gemini 產生專屬任務……';m.classList.add('show');try{const result=await Chapter02Cloud.generateTasks(place,note);const record={id:crypto.randomUUID(),name:place,note,createdAt:new Date().toISOString(),tasks:result.tasks,sources:result.sources||[],media:[],answer:''};await Chapter02Cloud.saveJourney(record);location.href='game.html?id='+encodeURIComponent(record.id)}catch(error){m.textContent='AI 任務產生失敗：'+error.message;button.disabled=false}});</script></body></html>
