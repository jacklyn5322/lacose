<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf2e3"><title>現場闖關｜台南・即興冒險</title><link rel="stylesheet" href="assets/site.css"><script src="assets/global-reset.js?v=5.9.0" defer></script></head><body class="theme-journey"><main class="page"><header class="topbar"><a class="nav" href="index.html">⌂</a><div class="brand">現場闖關</div><a class="nav" href="../index.html">↗</a></header><section class="content"><div class="tag">PLAY WHERE YOU ARE</div><h1 id="placeTitle">這一站的探索任務</h1><p class="lead">完成任務後，留下回答與原始照片／影片。</p><div class="notice" id="aiNotice">任務由雲端 Gemini 生成，不使用固定示範題庫。</div><div id="tasks">正在讀取任務……</div><form id="saveForm" class="card"><h2>這一站的回憶</h2><div class="field"><label for="answer">任務回答／心得</label><textarea id="answer" placeholder="記下你們的答案、過程或有趣的事"></textarea></div><div class="field"><label for="photo">上傳這一站的照片或影片</label><input id="photo" type="file" multiple accept="image/*,video/*,.heic,.heif,.dng,.tif,.tiff,.mov,.m4v,.mp4,.raw,.cr2,.nef,.arw,.raf,.rw2,.3gp,.avi,.mkv,.pdf,.zip,.bin,*/*"><div id="uploadStatus" class="upload-status"></div><div id="mediaPreview"></div></div><button class="btn" type="submit">完成並保存這一站</button></form><div class="actions"><a class="btn secondary" href="today.html">返回今日旅程</a><a class="btn secondary" href="album.html">查看回憶相簿</a></div></section></main><script src="assets/app.js"></script><script src="assets/cloud.js?v=5.9.0"></script><script>
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');let state,place,uploaded=[];
function renderTasks(){ $('tasks').innerHTML=(place.tasks||[]).map((t,i)=>`<article class="task"><div class="tag">任務 ${i+1} · ${esc(t.category)}</div><h3>${esc(t.text)}</h3><label><input type="checkbox" id="done${i}" style="width:auto;min-height:0" ${t.done?'checked':''}> 已完成</label></article>`).join('')||'<div class="empty">目前沒有任務，請返回今日旅程重新生成。</div>';if(place.sources?.length)$('tasks').innerHTML+='<div class="source-list">參考搜尋資料：'+place.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(' · ')+'</div>'; }
(async()=>{try{state=await Chapter02Cloud.loadState();place=state.places.find(x=>x.id===id);if(!place){location.replace('today.html');return}uploaded=(place.media||[]).slice();$('placeTitle').textContent=place.name+'｜探索任務';$('answer').value=place.answer||'';renderTasks()}catch(e){$('tasks').textContent='讀取雲端任務失敗：'+e.message}})();
$('photo').addEventListener('change',async()=>{const files=[...$('photo').files];if(!files.length)return;$('photo').disabled=true;try{for(const file of files){$('uploadStatus').textContent='正在上傳 '+file.name+'……';const media=await Chapter02Cloud.uploadFile(file,p=>$('uploadStatus').textContent='正在上傳 '+file.name+' '+p+'%');uploaded.push(media);const item=document.createElement('div');item.className='media-file';if(media.mediaType==='video'){const video=document.createElement('video');video.controls=true;video.src=media.url;item.appendChild(video)}else if(media.mediaType==='image'){const img=document.createElement('img');img.className='photo-preview';img.src=media.url;img.alt=media.name;item.appendChild(img)}const link=document.createElement('a');link.href=media.downloadUrl;link.textContent='下載原始檔案：'+media.name;item.appendChild(link);$('mediaPreview').appendChild(item)}$('uploadStatus').textContent='已成功保存 '+files.length+' 個原始檔案。'}catch(e){$('uploadStatus').textContent='上傳失敗：'+e.message}finally{$('photo').disabled=false;$('photo').value=''}});
$('saveForm').addEventListener('submit',async e=>{e.preventDefault();if(!place)return;const btn=e.submitter||$('saveForm').querySelector('button[type=submit]');btn.disabled=true;try{place.answer=$('answer').value;place.tasks=(place.tasks||[]).map((t,i)=>Object.assign({},t,{done:$('done'+i)?.checked||false}));place.media=uploaded;await Chapter02Cloud.saveJourney(place);location.href='today.html'}catch(err){$('uploadStatus').textContent='保存旅程失敗：'+err.message;btn.disabled=false}});
</script></body></html>
