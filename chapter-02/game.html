<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf2e3"><title>現場闖關｜台南・即興冒險</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="page"><header class="topbar"><a class="nav" href="index.html" aria-label="返回首頁">⌂</a><div class="brand">現場闖關</div><button class="nav" onclick="back()" aria-label="返回上一頁">‹</button></header><section class="content"><div class="tag">PLAY WHERE YOU ARE</div><h1 id="placeTitle">這一站的探索任務</h1><p class="lead">依照現場狀況挑選任務，完成後留下回答與照片。</p><div class="notice" id="aiNotice">目前為前端示範任務；真正的 AI 生成與網路搜尋需先設定安全的後端 API，不能把金鑰放在 GitHub Pages。</div><div id="tasks"></div><form id="saveForm" class="card"><h2>這一站的回憶</h2><div class="field"><label for="answer">任務回答／心得</label><textarea id="answer" placeholder="記下你們的答案、過程或有趣的事"></textarea></div><div class="field"><label for="photo">上傳這一站的照片</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" class="photo-preview hidden" alt="照片預覽"></div><button class="btn" type="submit">完成並保存這一站</button></form><div class="actions"><a class="btn secondary" href="today.html">返回今日旅程</a><a class="btn secondary" href="album.html">查看回憶相簿</a></div></section></main><script src="assets/app.js"></script><script>const d=load(),id=new URLSearchParams(location.search).get('id'),place=d.places.find(x=>x.id===id)||d.places[d.places.length-1];if(!place){location.href='today.html'}else{document.getElementById('placeTitle').textContent=place.name+'｜探索任務';const sets=[['搞怪任務','拍一張「這個地方最有戲」的表情或姿勢照片，並替它取一個電影片名。'],['景點探索','找出現場一個容易被忽略的細節：招牌、窗花、顏色、聲音或氣味，描述你發現了什麼。'],['認識彼此','各自說出這個地方最想帶走的一個感受，並分享原因。']];document.getElementById('tasks').innerHTML=sets.map((t,i)=>`<article class="task"><div class="tag">任務 ${i+1} · ${t[0]}</div><h3>${t[1]}</h3><label><input type="checkbox" id="done${i}" style="width:auto;min-height:0"> 已完成</label></article>`).join('');const input=document.getElementById('photo'),img=document.getElementById('preview');preview(input,img);document.getElementById('saveForm').addEventListener('submit',e=>{e.preventDefault();const file=input.files[0];const finish=src=>{place.answer=document.getElementById('answer').value;place.tasks=sets.map((t,i)=>({category:t[0],text:t[1],done:document.getElementById('done'+i).checked}));if(src){place.photos=place.photos||[];place.photos.push(src)}place.updatedAt=new Date().toISOString();save(d);location.href='today.html'};if(file)readFile(file,finish);else finish('')})}</script></body></html>
