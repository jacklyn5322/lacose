<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf1df"><title>旅程遊戲｜台南旅程</title><style>
:root{--paper:#fbf1df;--ink:#765239;--line:#d8bd9c;--coral:#d97861;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html{background:var(--paper);-webkit-text-size-adjust:100%}body{margin:0;min-height:100vh;min-height:100svh;background:radial-gradient(ellipse at 10% 10%,#f0d9d2 0,transparent 27%),radial-gradient(ellipse at 95% 40%,#e4e9d5 0,transparent 30%),var(--paper);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink)}.page{max-width:560px;margin:auto;min-height:100svh;padding:0 0 calc(28px + var(--safe))}.top{height:58px;padding:0 18px;display:flex;align-items:center;justify-content:space-between}.nav{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;background:#fff9ef;color:var(--ink);font-size:22px;text-decoration:none;display:grid;place-items:center}.brand{font-weight:800;font-size:14px}.head{text-align:center;padding:18px 20px 12px}.eyebrow{font-size:12px;letter-spacing:.17em;color:#a77c55}h1{font-size:32px;margin:6px 0 8px;letter-spacing:.1em}.place{font-size:15px;margin:0;line-height:1.7}.toolbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px 16px 16px}.chip{border:1px solid #c9aa85;background:#fff9ef;color:var(--ink);border-radius:999px;padding:9px 13px;font-size:13px}.chip.active{background:#e9d8bb;border-color:#a98059}.list{padding:0 16px;display:grid;gap:13px}.task{background:rgba(255,250,240,.94);border:1.5px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 4px 12px #7652390c}.task-top{display:flex;align-items:center;gap:10px}.emoji{font-size:28px}.kind{font-size:12px;color:#a77c55}.task h2{font-size:18px;margin:2px 0 7px}.task p{font-size:14px;line-height:1.7;margin:0 0 12px}.task label{font-size:13px;font-weight:700}.task input[type=text]{width:100%;margin-top:7px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fffdf8;font-size:16px}.task input[type=file]{width:100%;margin-top:9px;font-size:13px}.done{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:14px}.done input{width:21px;height:21px;accent-color:#b86b54}.preview{max-width:100%;max-height:170px;display:none;margin-top:10px;border-radius:12px}.actions{padding:18px 22px;display:grid;gap:12px}.btn{width:100%;min-height:56px;border:2px solid #b85f4b;border-radius:999px;background:var(--coral);color:#fffaf1;font-size:17px;font-weight:800;box-shadow:0 4px 0 #b85f4b}.btn.secondary{background:#fff9ef;color:var(--ink);border-color:#c9a77f;box-shadow:0 4px 0 #d8bd9c}.status{margin:0 18px;padding:12px;border-radius:14px;background:#fff9ef;border:1px solid var(--line);font-size:14px;line-height:1.6;display:none}.status.show{display:block}.album-title{padding:22px 20px 8px;text-align:center}.record{margin:0 16px 12px;padding:14px;border:1px solid var(--line);border-radius:18px;background:#fffaf0;font-size:14px;line-height:1.7}.record img{max-width:100%;max-height:130px;object-fit:cover;border-radius:10px;margin:5px}.hidden{display:none!important}@media(min-width:561px){body{padding:18px 0}.page{border-radius:20px;box-shadow:0 10px 40px #5c412a1f}}
</style></head><body><main class="page"><header class="top"><a class="nav" href="destination.html" aria-label="返回景點輸入">‹</a><div class="brand">台南旅程 ✿</div><a class="nav" href="index.html" aria-label="回首頁">⌂</a></header><section id="play"><div class="head"><div class="eyebrow">A LITTLE GAME AT THIS STOP</div><h1>旅程任務卡</h1><p class="place" id="placeText"></p></div><div class="toolbar" id="filters"><button class="chip active" data-kind="all">全部任務</button><button class="chip" data-kind="搞怪挑戰">搞怪挑戰</button><button class="chip" data-kind="景點探索">景點探索</button><button class="chip" data-kind="認識彼此">認識彼此</button></div><section class="list" id="tasks"></section><div class="actions"><button class="btn" id="save">完成並保存這一站</button><button class="btn secondary" onclick="location.href='destination.html'">前往下一站</button></div><div class="status" id="status" role="status" aria-live="polite"></div></section><section id="album" class="hidden"><div class="album-title"><div class="eyebrow">OUR LITTLE MEMORIES</div><h1>旅程測試紀錄</h1><p class="place">目前保存在這台手機的瀏覽器中</p></div><div id="records"></div><div class="actions"><button class="btn secondary" onclick="location.href='index.html'">返回首頁</button><button class="btn secondary" id="clear">清空本機測試紀錄</button></div></section></main><script>
const $=id=>document.getElementById(id);const qs=new URLSearchParams(location.search);const albumMode=qs.get('album')==='1';const place=sessionStorage.getItem('ch2_current_place')||'台南探索中';const notes=sessionStorage.getItem('ch2_current_notes')||'';$('placeText').textContent='📍 '+place+(notes?'｜'+notes:'');
const allTasks=[
{kind:'搞怪挑戰',emoji:'📸',title:'模仿一張神秘照片',desc:'請其中一人找一張手機裡的照片或網路圖片，另一人模仿姿勢，在目前地點拍下一張有趣的版本。',prompt:'這次模仿的是哪種姿勢或表情？'},
{kind:'景點探索',emoji:'🔎',title:'找出這裡的小線索',desc:'觀察附近建築、招牌或裝飾，找出一個最有台南特色的細節，拍照留下線索。',prompt:'你們找到的特色細節是什麼？'},
{kind:'認識彼此',emoji:'💬',title:'如果今天多一個小時',desc:'輪流回答：如果今天在這個地方多出一個小時，你最想一起做什麼？為什麼？',prompt:'記下其中一個有趣的回答。'}];let chosen=allTasks.slice();let photos={};
function render(){ $('tasks').innerHTML='';chosen.forEach((t,i)=>{const card=document.createElement('article');card.className='task';card.dataset.kind=t.kind;card.innerHTML=`<div class="task-top"><span class="emoji">${t.emoji}</span><div><div class="kind">${t.kind}</div><h2>任務 ${i+1}｜${t.title}</h2></div></div><p>${t.desc}</p><label>${t.prompt}<input type="text" class="answer" maxlength="180" placeholder="寫下你們的紀錄（選填）"></label><label style="display:block;margin-top:12px">上傳這項任務的照片（選填）<input type="file" class="photo" accept="image/*" capture="environment"></label><img class="preview" alt="照片預覽"><label class="done"><input type="checkbox" class="complete"> 我們完成這項任務</label>`;const file=card.querySelector('.photo'),preview=card.querySelector('.preview');file.addEventListener('change',()=>{const f=file.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{preview.src=reader.result;preview.style.display='block';photos[i]=reader.result};reader.readAsDataURL(f)});$('tasks').appendChild(card)});}
function showStatus(s){$('status').textContent=s;$('status').classList.add('show')}
function saveRecord(){const cards=[...document.querySelectorAll('.task')];const completed=cards.filter(c=>c.querySelector('.complete').checked).length;if(!completed){showStatus('請至少勾選完成一項任務，再保存這一站。');return;}const record={id:Date.now(),place,notes,date:new Date().toLocaleString('zh-TW'),tasks:cards.map((c,i)=>({kind:chosen[i].kind,title:chosen[i].title,done:c.querySelector('.complete').checked,answer:c.querySelector('.answer').value,photo:photos[i]||''}))};try{const records=JSON.parse(localStorage.getItem('ch2_test_records')||'[]');records.unshift(record);localStorage.setItem('ch2_test_records',JSON.stringify(records));showStatus(`已保存「${place}」！完成 ${completed}/${cards.length} 項任務。紀錄已存入這台手機的瀏覽器。`)}catch(e){showStatus('儲存空間可能不足（照片檔案較大）。請改用較小照片後再試。')}}
function renderAlbum(){let records=[];try{records=JSON.parse(localStorage.getItem('ch2_test_records')||'[]')}catch(e){}$('records').innerHTML=records.length?'':'<div class="record">目前還沒有保存的旅程紀錄。</div>';records.forEach(r=>{const box=document.createElement('article');box.className='record';const title=document.createElement('strong');title.textContent='📍 '+r.place+'　';box.append(title,document.createTextNode(r.date));r.tasks.forEach(t=>{const p=document.createElement('p');p.textContent=(t.done?'✓ ':'○ ')+t.title+(t.answer?'｜'+t.answer:'');box.appendChild(p);if(t.photo){const im=document.createElement('img');im.src=t.photo;im.alt='任務照片';box.appendChild(im)}});$('records').appendChild(box)})}
if(albumMode){$('play').classList.add('hidden');$('album').classList.remove('hidden');renderAlbum();$('clear').addEventListener('click',()=>{if(confirm('確定清空這台手機中的第二章測試紀錄？此操作無法復原。')){localStorage.removeItem('ch2_test_records');renderAlbum()}})}else{render();$('save').addEventListener('click',saveRecord);$('filters').addEventListener('click',e=>{const b=e.target.closest('button[data-kind]');if(!b)return;document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x===b));const k=b.dataset.kind;document.querySelectorAll('.task').forEach(c=>c.classList.toggle('hidden',k!=='all'&&c.dataset.kind!==k))})}
</script></body></html>
