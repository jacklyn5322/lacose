<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf2e3"><title>現場闖關｜台南・即興冒險</title><link rel="stylesheet" href="assets/site.css"><script src="assets/global-reset.js?v=5.11.1" defer></script></head><body class="theme-journey"><main class="page"><header class="topbar"><a class="nav" href="index.html">⌂</a><div class="brand">現場闖關</div><a class="nav" href="../index.html">↗</a></header><section class="content"><div class="tag">PLAY WHERE YOU ARE</div><h1 id="placeTitle">這一站的探索任務</h1><p class="lead">完成任務後，留下回答與原始照片／影片。</p><div class="notice" id="aiNotice">任務由雲端 Gemini 生成，不使用固定示範題庫。</div><div id="tasks">正在讀取任務……</div><form id="saveForm" class="card"><h2>這一站的回憶</h2><div class="field"><label for="answer">任務回答／心得</label><textarea id="answer" placeholder="記下你們的答案、過程或有趣的事"></textarea></div><div class="field"><label for="photo">上傳這一站的照片或影片</label><input id="photo" type="file" multiple accept="image/*,video/*,.heic,.heif,.dng,.tif,.tiff,.mov,.m4v,.mp4,.raw,.cr2,.nef,.arw,.raf,.rw2,.3gp,.avi,.mkv,.pdf,.zip,.bin,*/*"><div id="uploadStatus" class="upload-status"></div><div id="mediaPreview"></div></div><button class="btn" id="saveStationBtn" type="submit" disabled>完成並保存這一站</button><div id="saveHint" class="small" role="status">正在讀取這一站資料……</div></form><div class="actions"><a class="btn secondary" href="today.html">返回今日旅程</a><a class="btn secondary" href="album.html">查看回憶相簿</a></div></section></main><script src="assets/app.js"></script><script src="assets/cloud.js?v=5.11.1"></script><script>
const $=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');
let state,place,uploaded=[],uploading=false,uploadFailures=[];
function updateSaveButton(){const btn=$('saveStationBtn');const ready=!!place&&!uploading&&uploadFailures.length===0;btn.disabled=!ready;$('saveHint').textContent=uploading?'照片或影片仍在上傳，請等待全部完成。':uploadFailures.length?'仍有檔案上傳失敗，請重新選取失敗檔案並完成上傳。':ready?'所有已選檔案均已上傳完成，可以保存這一站。':'正在準備資料……';}
function renderTasks(){ $('tasks').innerHTML=(place.tasks||[]).map((t,i)=>`<article class="task"><div class="tag">任務 ${i+1} · ${esc(t.category)}</div><h3>${esc(t.text)}</h3><label><input type="checkbox" id="done${i}" style="width:auto;min-height:0" ${t.done?'checked':''}> 已完成</label></article>`).join('')||'<div class="empty">目前沒有任務，請返回今日旅程重新生成。</div>';if(place.sources?.length)$('tasks').innerHTML+='<div class="source-list">參考搜尋資料：'+place.sources.map(s=>`<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a>`).join(' · ')+'</div>'; }
function showUploaded(media){const item=document.createElement('div');item.className='media-file';const type=String(media.mimeType||'').toLowerCase();if(Chapter02Cloud.canPreviewImage(media)){const img=document.createElement('img');img.className='photo-preview';img.src=media.url;img.alt=media.name;img.onerror=()=>{img.replaceWith(document.createTextNode('此照片無法直接預覽，請使用原始檔案連結。'))};item.appendChild(img)}else if(type.startsWith('video/')){const video=document.createElement('video');video.controls=true;video.preload='metadata';video.src=media.url;item.appendChild(video)}const link=document.createElement('a');link.href=media.downloadUrl;link.textContent='下載原始檔案：'+media.name;link.target='_blank';link.rel='noopener';item.appendChild(link);$('mediaPreview').appendChild(item)}
(async()=>{try{state=await Chapter02Cloud.loadState();place=state.places.find(x=>x.id===id);if(!place){location.replace('today.html');return}uploaded=(place.media||[]).slice();$('placeTitle').textContent=place.name+'｜探索任務';$('answer').value=place.answer||'';renderTasks();uploaded.forEach(showUploaded);updateSaveButton()}catch(e){$('tasks').textContent='讀取雲端任務失敗：'+e.message;$('saveHint').textContent='無法載入旅程，暫時不能保存。'}})();
$('photo').addEventListener('change',async()=>{const files=[...$('photo').files];if(!files.length)return;uploading=true;uploadFailures=[];$('photo').disabled=true;updateSaveButton();let successes=0;for(let i=0;i<files.length;i++){const file=files[i];$('uploadStatus').textContent=`正在上傳第 ${i+1}/${files.length} 個檔案：${file.name}（0%）`;try{const media=await Chapter02Cloud.uploadFile(file,p=>$('uploadStatus').textContent=`正在上傳第 ${i+1}/${files.length} 個檔案：${file.name}（${p}%）`,{purpose:'journey',journeyId:place.id,placeName:place.name,city:'台南'});uploaded.push(media);place.media=uploaded.slice();await Chapter02Cloud.saveJourney(place);showUploaded(media);successes++;}catch(e){uploadFailures.push({file,error:e.message});$('uploadStatus').textContent+=`\n上傳失敗：${file.name} — ${e.message}`;}}
 uploading=false;$('photo').disabled=false;$('photo').value='';if(uploadFailures.length){$('uploadStatus').textContent=`成功 ${successes} 個；失敗 ${uploadFailures.length} 個。請重新選取失敗檔案再上傳。\n`+uploadFailures.map(x=>x.file.name+'：'+x.error).join('\n')}else{$('uploadStatus').textContent=`全部上傳完成，共 ${successes} 個檔案；原始檔已保存至雲端。`}updateSaveButton();});
$('saveForm').addEventListener('submit',async e=>{e.preventDefault();if(!place)return;if(uploading||uploadFailures.length){updateSaveButton();return}const btn=$('saveStationBtn');btn.disabled=true;try{place.answer=$('answer').value;place.tasks=(place.tasks||[]).map((t,i)=>Object.assign({},t,{done:$('done'+i)?.checked||false}));place.media=uploaded;await Chapter02Cloud.saveJourney(place);$('saveHint').textContent='這一站已成功保存。';location.href='today.html'}catch(err){$('uploadStatus').textContent='保存旅程失敗：'+err.message;updateSaveButton()}});
</script></body></html>
