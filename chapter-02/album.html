<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf2e3"><title>回憶相簿｜台南・即興冒險</title><link rel="stylesheet" href="assets/site.css"></head><body><main class="page"><header class="topbar"><a class="nav" href="index.html" aria-label="返回首頁">⌂</a><div class="brand">回憶相簿</div><button class="nav" onclick="back()" aria-label="返回上一頁">‹</button></header><section class="content"><div class="tag">OUR JOURNEY ALBUM</div><h1>把今天收藏起來</h1><p class="lead">景點與任務照片會依照實際紀錄順序整理。旅程快結束時，再上傳完整的地點插畫。</p><div class="card"><h2>今日旅程插畫</h2><p class="small">此插畫由管理後台統一上傳與管理。</p><img id="illustrationPreview" class="photo-preview hidden" alt="今日旅程插畫"></div><div class="card"><h2>旅程足跡</h2><div id="albumList"></div></div><div class="actions"><a class="btn secondary" href="today.html">繼續今日旅程</a></div></section></main><script src="assets/app.js"></script><script>const d=load(),img=document.getElementById('illustrationPreview');if(d.illustration){img.src=d.illustration;img.classList.remove('hidden')}const el=document.getElementById('albumList');el.innerHTML=d.places.length?d.places.map((p,i)=>`<article class="entry"><b>${i+1}. ${esc(p.name)}</b><div class="small">${new Date(p.createdAt).toLocaleString('zh-TW')}</div><p>${esc(p.note||'')}</p><p>${esc(p.answer||'')}</p>${(p.tasks||[]).map(t=>`<div class="small">${t.done?'✓':'○'} ${esc(t.category)}：${esc(t.text)}</div>`).join('')}${(p.photos||[]).map(src=>`<img src="${src}" alt="景點照片">`).join('')}</article>`).join(''):'<div class="empty">今天還沒有景點紀錄。開始旅程後，這裡會自動整理足跡。</div>';</script></body></html>
