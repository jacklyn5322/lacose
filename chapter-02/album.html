<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fbf2e3"><title>回憶相簿｜台南・即興冒險</title><link rel="stylesheet" href="assets/site.css"><script src="assets/global-reset.js?v=5.7.0" defer></script></head><body><main class="page"><header class="topbar"><a class="nav" href="index.html">⌂</a><div class="brand">回憶相簿</div><a class="nav" href="../index.html">↗</a></header><section class="content"><div class="tag">OUR JOURNEY ALBUM</div><h1>把今天收藏起來</h1><p class="lead">旅程資料與原始媒體都從雲端讀取，依實際紀錄順序排列。</p><div class="card"><h2>今日旅程插畫</h2><img id="illustrationPreview" class="photo-preview hidden" alt="今日旅程插畫"><p class="small">最後的手繪地圖由管理後台統一上傳。</p></div><div class="card"><h2>旅程足跡</h2><div id="albumList">正在讀取雲端資料……</div></div><div class="actions"><a class="btn secondary" href="today.html">繼續今日旅程</a></div></section></main><script src="assets/app.js"></script><script src="assets/cloud.js?v=5.7.0"></script><script>
(async()=>{const el=document.getElementById('albumList'),img=document.getElementById('illustrationPreview');try{const d=await Chapter02Cloud.loadState();const map=Chapter02Cloud.API+'/public/chapter-02/map';const r=await fetch(map,{method:'HEAD'});if(r.ok){img.src=map;img.classList.remove('hidden')}el.innerHTML=d.places.length?d.places.map((p,i)=>`<article class="entry"><b>${i+1}. ${esc(p.name)}</b><div class="small">${new Date(p.createdAt).toLocaleString('zh-TW')}</div><p>${esc(p.note||'')}</p><p>${esc(p.answer||'')}</p>${(p.tasks||[]).map(t=>`<div class="small">${t.done?'✓':'○'} ${esc(t.category)}：${esc(t.text)}</div>`).join('')}${(p.photos||[]).map(m=>m.mimeType?.startsWith('image/')?`<img src="${m.url}" alt="旅程照片"><a href="${Chapter02Cloud.mediaUrl(m,true)}">下載原始檔案</a>`:m.mimeType?.startsWith('video/')?`<video controls class="photo-preview" src="${m.url}"></video><a href="${Chapter02Cloud.mediaUrl(m,true)}">下載原始影片</a>`:`<a href="${Chapter02Cloud.mediaUrl(m,true)}">下載／開啟 ${esc(m.name||'原始檔案')}</a>`).join('')}</article>`).join(''):'<div class="empty">今天還沒有景點紀錄。開始旅程後，這裡會自動整理足跡。</div>'}catch(e){el.textContent='雲端相簿讀取失敗：'+e.message}})();
</script></body></html>
