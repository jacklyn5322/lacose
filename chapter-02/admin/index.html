<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二章管理後台</title><link rel="stylesheet" href="../assets/site.css"></head><body><main class="page"><header class="topbar"><a class="nav" href="../index.html">⌂</a><b>CHAPTER 02 ADMIN</b><a class="nav" href="../index.html">×</a></header><section class="content"><div class="tag">PRIVATE WORKSPACE</div><h1>第二章管理後台</h1><div class="notice">重要：這是獨立管理介面的前端原型。GitHub Pages 是靜態託管，無法提供真正的登入驗證或跨網域安全資料庫；正式上線前必須部署至獨立管理網域並接上受保護的後端。不要在此頁輸入密碼或放 API Key。</div><div class="card"><h2>三份驚喜禮物設定</h2><div id="gifts"></div><button class="btn" id="saveGifts">儲存禮物設定（本機預覽）</button></div><div class="card"><h2>今日旅程插畫</h2><p class="small">在管理後台上傳；正式相簿只讀取這裡設定的插畫。</p><input id="illustrationFile" type="file" accept="image/*"><img id="illustrationPreview" class="photo-preview hidden" alt="插畫預覽"><button class="btn" id="saveIllustration">儲存今日旅程插畫</button></div><div class="card"><h2>旅程資料檢視</h2><div id="records"></div><button class="btn secondary" id="export">匯出 JSON 備份</button><button class="btn secondary" id="clear">清除本機測試資料</button></div></section></main><script src="../assets/app.js"></script><script>const d=load(),g=document.getElementById('gifts');const artInput=document.getElementById('illustrationFile'),artPreview=document.getElementById('illustrationPreview');if(d.illustration){artPreview.src=d.illustration;artPreview.classList.remove('hidden')}preview(artInput,artPreview);document.getElementById('saveIllustration').onclick=()=>{const file=artInput.files[0];if(!file){alert('請先選擇插畫');return}readFile(file,src=>{d.illustration=src;try{save(d);artPreview.src=src;artPreview.classList.remove('hidden');alert('插畫已儲存於目前瀏覽器。')}catch(e){alert('圖片過大，無法儲存於瀏覽器。請縮小圖片後再試。')}})};g.innerHTML=[0,1,2].map(i=>`<div class="field"><label>第${i+1}份禮物名稱</label><input id="name${i}" placeholder="填入禮物名稱" value="${esc(d.gifts?.[i]?.name||'')}"><label>第${i+1}份禮物意義</label><textarea id="meaning${i}" placeholder="填入這份禮物想傳達的意義">${esc(d.gifts?.[i]?.meaning||'')}</textarea></div>`).join('');document.getElementById('saveGifts').onclick=()=>{d.gifts=d.gifts||[];[0,1,2].forEach(i=>{d.gifts[i]={...(d.gifts[i]||{}),name:document.getElementById('name'+i).value,meaning:document.getElementById('meaning'+i).value}});save(d);alert('已儲存在目前瀏覽器的本機資料。')};document.getElementById('records').innerHTML=d.places?.length?d.places.map(p=>`<div class="entry"><b>${esc(p.name)}</b><div class="small">${esc(p.answer||'尚無回答')}</div></div>`).join(''):'<div class="empty">目前沒有景點資料</div>';document.getElementById('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download='chapter-02-backup.json';a.click();URL.revokeObjectURL(a.href)};document.getElementById('clear').onclick=()=>{if(confirm('確定清除本機第二章測試資料？此動作無法復原。')){localStorage.removeItem('ch2_journey_v2');location.reload()}};</script></body></html>
