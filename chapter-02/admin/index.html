<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
.launch-wrap{max-width:680px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 18px calc(28px + env(safe-area-inset-bottom))}
.launch-card{background:#fffdf8;border:1px solid #eadfce;border-radius:20px;padding:24px;margin-top:22px;box-shadow:0 8px 24px #654b2b0b}
.launch-card h1{font-size:26px;margin:8px 0}.launch-card p{font-size:14px;line-height:1.8;color:#8d7862}
.launch-btn{display:block;width:100%;border:0;border-radius:12px;padding:15px;background:#80694f;color:#fff;text-align:center;font-size:15px;font-weight:700;cursor:pointer}
.launch-status{min-height:24px;margin-top:14px;font-size:13px;line-height:1.7;color:#718064}

<main class="launch-wrap"><header class="topbar"><a class="nav" href="../index.html" aria-label="返回首頁">⌂</a><div class="brand">CHAPTER 02 · ADMIN</div><span></span></header>
<section class="launch-card"><div class="tag">PRIVATE WORKSPACE</div><h1>第二章管理後台</h1><p>後台只有兩項功能：上傳最後的手繪地圖，以及清除第二章測試資料。管理操作會在安全的 Cloud Run 登入頁面中進行。</p>
<button class="launch-btn" id="openAdmin" type="button">開啟管理後台</button><div class="launch-status" id="status" role="status" aria-live="polite">請在新分頁完成 Google 管理員登入與操作。</div>
<div class="launch-note">清除後會發布全裝置清除通知。所有裝置在開啟第二章或重新連線時，會自動清除第二章本機測試資料；離線裝置會在恢復連線後執行。</div></section></main>
<script>
const API='https://private-album-api-796382184623.asia-east1.run.app';
const KEY='ch2_journey_v2';
document.getElementById('openAdmin').addEventListener('click',()=>{const w=window.open(API+'/admin/chapter-02','_blank');if(!w)document.getElementById('status').textContent='瀏覽器封鎖了新分頁，請允許此網站開啟彈出式視窗後再試。';else document.getElementById('status').textContent='管理後台已在新分頁開啟。請完成登入與操作。';});
window.addEventListener('message',event=>{if(event.origin!==API||event.data?.type!=='CHAPTER_02_RESET')return;try{localStorage.removeItem(KEY);sessionStorage.removeItem(KEY);document.getElementById('status').textContent='第二章雲端與本機測試資料均已清除。可以重新開始測試。';}catch(e){document.getElementById('status').textContent='雲端已清除，但本機資料清除失敗：'+e.message;}});
</script></body></html>
