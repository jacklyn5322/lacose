<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dceef7">
  <title>回憶相簿｜海風收藏所</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="config.js"></script>
  <script defer src="js/gallery.js"></script>
</head>
<body>
  <div class="site-bg" aria-hidden="true"></div>
  <main class="shell inner-shell">
    <header class="topbar">
      <a class="back-link" href="index.html">← <span>回到回憶首頁</span></a>
      <span class="chapter-mark">MEMORY ALBUM</span>
    </header>
    <section class="inner-heading">
      <p class="eyebrow" id="folder-label">CHAPTER 01 · MEMORY</p>
      <h1 id="album-title">正在打開回憶…</h1>
      <p id="album-description" class="hero-copy">每一張照片，都是那一天留下的小小風景。</p>
    </section>
    <div class="gallery-toolbar">
      <span id="photo-count">正在讀取相簿…</span>
      <a class="text-link" href="index.html">其他回憶 ↗</a>
    </div>
    <div class="photo-grid" id="photo-grid"></div>
    <div class="empty-state" id="empty-state" hidden>
      <span class="empty-icon">☁</span>
      <h2>這本相簿正在等待回憶</h2>
      <p>目前這個雲端資料夾沒有可顯示的照片或影片。</p>
    </div>
    <div class="load-more-wrap"><button class="outline-button" id="load-more" hidden>載入更多照片</button></div>
    <p class="api-status" id="api-status" aria-live="polite"></p>
  </main>
</body>
</html>
