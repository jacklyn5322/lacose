<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171513"><title>我們的回憶</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#171513;color:#f7f3ed;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.top{position:sticky;top:0;z-index:3;background:#171513ed;backdrop-filter:blur(12px);padding:18px max(18px,4vw);border-bottom:1px solid #ffffff18}.top h1{font-size:22px;margin:0 0 6px}.muted{color:#b8afa5;font-size:13px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}button,select{background:#302c28;color:#fff;border:1px solid #514940;border-radius:10px;padding:10px 13px;font:inherit}button{cursor:pointer}.grid{padding:18px max(12px,3vw);display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}.tile{position:relative;aspect-ratio:1/1;background:#292522;border-radius:12px;overflow:hidden;cursor:pointer}.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}.tile .tag{position:absolute;bottom:7px;left:7px;background:#0009;padding:4px 7px;border-radius:6px;font-size:11px}.empty{text-align:center;padding:60px 20px;color:#b8afa5}.viewer{display:none;position:fixed;inset:0;background:#000;z-index:10;align-items:center;justify-content:center}.viewer.show{display:flex}.viewer img,.viewer video{max-width:100vw;max-height:100dvh;width:auto;height:auto;object-fit:contain}.close{position:absolute;top:14px;right:14px;z-index:2;background:#ffffff22;border:0}.nav{position:absolute;top:50%;transform:translateY(-50%);background:#ffffff22;border:0;font-size:26px}.prev{left:10px}.next{right:10px}.upload{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.upload input[type=file]{max-width:220px}.status{min-height:20px;margin-top:8px;font-size:13px;color:#d6c7ae}@media(min-width:850px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}}
</style></head><body>
<header class="top"><h1>我們的回憶</h1><div class="muted" id="subtitle">正在載入回憶…</div><div class="bar"><select id="folder"><option value="">全部回憶</option></select><button id="reload">重新整理</button><div class="upload"><input id="files" type="file" accept="image/*,video/*" multiple><button id="uploadBtn">上傳照片／影片</button></div></div><div class="status" id="status"></div></header>
<main id="grid" class="grid"></main><div id="empty" class="empty" hidden>目前沒有可顯示的回憶</div>
<div id="viewer" class="viewer"><button class="close" id="close">✕</button><button class="nav prev" id="prev">‹</button><div id="stage"></div><button class="nav next" id="next">›</button></div>
<script>
const API='https://private-album-api-796382184623.asia-east1.run.app';let items=[],index=0,folders=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){ $('status').textContent='';try{let st=await fetch(API+'/public/status',{cache:'no-store'}).then(r=>r.json());if(!st.isOpen){$('subtitle').textContent='相簿目前關閉';$('grid').innerHTML='';$('empty').hidden=false;$('empty').textContent='相簿目前暫停開放';return}let d=await fetch(API+'/public/library',{cache:'no-store'}).then(async r=>{let j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j});folders=d.folders||[];items=d.mediaFiles||[];$('subtitle').textContent=`${items.length} 個回憶`;let sel=$('folder'),v=sel.value;sel.innerHTML='<option value="">全部回憶</option>'+folders.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');sel.value=v;render()}catch(e){$('subtitle').textContent='暫時無法載入相簿';$('status').textContent=e.message}}
function filtered(){return items.filter(x=>!$('folder').value||x.folderId===$('folder').value)}
function render(){let a=filtered();$('grid').innerHTML=a.map((m,i)=>`<div class="tile" data-i="${i}">${m.mediaType==='photo'?`<img loading="lazy" src="${API}/media/${encodeURIComponent(m.id)}" alt="${esc(m.name)}">`:`<video muted playsinline preload="metadata" src="${API}/media/${encodeURIComponent(m.id)}"></video><span class="tag">▶ 影片</span>`}</div>`).join('');$('empty').hidden=a.length>0;$('grid').querySelectorAll('.tile').forEach(el=>el.addEventListener('click',()=>openViewer(Number(el.dataset.i))))}
function openViewer(i){let a=filtered();if(!a.length)return;index=i;showItem()}function showItem(){let a=filtered(),m=a[index];if(!m)return;$('stage').innerHTML=m.mediaType==='photo'?`<img src="${API}/media/${encodeURIComponent(m.id)}" alt="${esc(m.name)}">`:`<video controls autoplay playsinline src="${API}/media/${encodeURIComponent(m.id)}"></video>`;$('viewer').classList.add('show')}
function move(n){let a=filtered();index=(index+n+a.length)%a.length;showItem()}$('close').onclick=()=>{$('viewer').classList.remove('show');$('stage').innerHTML=''};$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);document.addEventListener('keydown',e=>{if(!$('viewer').classList.contains('show'))return;if(e.key==='Escape')$('close').click();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});$('folder').onchange=render;$('reload').onclick=load;
$('uploadBtn').onclick=async()=>{const files=[...$('files').files];if(!files.length){$('status').textContent='請先選擇照片或影片';return}let folderId=$('folder').value||folders[0]?.id;if(!folderId){$('status').textContent='目前沒有可上傳的資料夾';return}let key=sessionStorage.getItem('albumUploadKey')||prompt('請輸入上傳專用授權碼（觀看相簿不需要此碼）');if(!key)return;sessionStorage.setItem('albumUploadKey',key);for(let i=0;i<files.length;i++){let f=files[i];$('status').textContent=`正在上傳 ${i+1}/${files.length}：${f.name}`;try{let r=await fetch(API+'/upload',{method:'POST',headers:{'Content-Type':f.type,'X-Album-Upload-Key':key,'X-Album-Folder-Id':folderId,'X-Album-File-Name':encodeURIComponent(f.name)},body:f});let d=await r.json();if(!r.ok)throw Error(d.error||r.status)}catch(e){$('status').textContent=`${f.name} 上傳失敗：${e.message}`;return}}$('status').textContent='上傳完成，正在更新回憶…';$('files').value='';await load();$('status').textContent='全部上傳完成'};
load();setInterval(load,60000);
</script></body></html>
