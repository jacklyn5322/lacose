<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171513"><title>我們的回憶</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#171513;color:#f7f3ed;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.top{position:sticky;top:0;z-index:3;background:#171513ed;backdrop-filter:blur(12px);padding:18px max(18px,4vw);border-bottom:1px solid #ffffff18}.top h1{font-size:22px;margin:0 0 6px}.muted{color:#b8afa5;font-size:13px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}button,select{background:#302c28;color:#fff;border:1px solid #514940;border-radius:10px;padding:10px 13px;font:inherit}button{cursor:pointer}.grid{padding:18px max(12px,3vw);display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}.tile{position:relative;aspect-ratio:1/1;background:#292522;border-radius:12px;overflow:hidden;cursor:pointer}.tile img,.tile video{width:100%;height:100%;object-fit:cover;display:block}.tile video{pointer-events:none;background:#292522}.video-placeholder{width:100%;height:100%;display:grid;place-items:center;color:#b8afa5;font-size:42px;background:linear-gradient(135deg,#302c28,#1f1c1a)}.video-placeholder.loading{font-size:12px}.tile video{background:#292522}.tile .tag{z-index:1}.tile .tag{position:absolute;bottom:7px;left:7px;background:#0009;padding:4px 7px;border-radius:6px;font-size:11px}.empty{text-align:center;padding:60px 20px;color:#b8afa5}.viewer{display:none;position:fixed;inset:0;background:#000;z-index:10;align-items:center;justify-content:center}.viewer.show{display:flex}.viewer img,.viewer video{max-width:100vw;max-height:100dvh;width:auto;height:auto;object-fit:contain}.close{position:absolute;top:14px;right:14px;z-index:2;background:#ffffff22;border:0}.nav{position:absolute;top:50%;transform:translateY(-50%);background:#ffffff22;border:0;font-size:26px}.prev{left:10px}.next{right:10px}.upload{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.upload input[type=file]{max-width:220px}.status{min-height:20px;margin-top:8px;font-size:13px;color:#d6c7ae}@media(min-width:850px){.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}}
</style></head><body>
<header class="top"><h1>我們的回憶</h1><div class="muted" id="subtitle">正在載入回憶…</div><div class="bar"><select id="folder"><option value="">全部回憶</option></select><button id="reload">重新整理</button><div class="upload"><input id="files" type="file" accept="image/*,video/*" multiple><button id="uploadBtn">上傳照片／影片</button></div></div><div class="status" id="status"></div></header>
<main id="grid" class="grid"></main><div id="empty" class="empty" hidden>目前沒有可顯示的回憶</div>
<div id="viewer" class="viewer"><button class="close" id="close">✕</button><button class="nav prev" id="prev">‹</button><div id="stage"></div><button class="nav next" id="next">›</button></div><div id="preloadBin" aria-hidden="true" style="position:fixed;left:-10000px;top:0;width:2px;height:2px;overflow:hidden;opacity:.01;pointer-events:none"></div>
<script>
// Album frontend 5.5.0: persistent IndexedDB video thumbnails + prioritized lazy loading.
const API='https://private-album-api-796382184623.asia-east1.run.app';let items=[],index=0,folders=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){ $('status').textContent='';try{let st=await fetch(API+'/public/status',{cache:'no-store'}).then(r=>r.json());if(!st.isOpen){$('subtitle').textContent='相簿目前關閉';$('grid').innerHTML='';$('empty').hidden=false;$('empty').textContent='相簿目前暫停開放';return}let d=await fetch(API+'/public/library',{cache:'no-store'}).then(async r=>{let j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j});folders=d.folders||[];items=d.mediaFiles||[];$('subtitle').textContent=`${items.length} 個回憶`;let sel=$('folder'),v=sel.value;sel.innerHTML='<option value="">全部回憶</option>'+folders.map(f=>`<option value="${esc(f.id)}">${esc(f.name)}</option>`).join('');sel.value=v;render();warmAround(0)}catch(e){$('subtitle').textContent='暫時無法載入相簿';$('status').textContent=e.message}}
function filtered(){return items.filter(x=>!$('folder').value||x.folderId===$('folder').value)}
function posterFor(video){
  const stem=video.name.replace(/\.playable\.mp4$/i,'').replace(/\.(mp4|mov|m4v|webm)$/i,'');
  return items.find(x=>x.folderId===video.folderId && x.mediaType==='photo' && /poster/i.test(x.name) && x.name.toLowerCase().includes(stem.toLowerCase()))
    || items.find(x=>x.folderId===video.folderId && x.mediaType==='photo' && /poster/i.test(x.name) && stem.toLowerCase().includes(x.name.replace(/[_ .-]?poster\.(jpg|jpeg|png|webp)$/i,'').toLowerCase()));
}
const preloaded=new Map();
const thumbQueue=[];let activeThumbLoads=0;
const THUMB_DB='private-album-thumbnails-v1',THUMB_STORE='frames';let thumbDbPromise=null;
function openThumbDb(){if(!('indexedDB'in window))return Promise.resolve(null);if(thumbDbPromise)return thumbDbPromise;thumbDbPromise=new Promise(resolve=>{const req=indexedDB.open(THUMB_DB,1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(THUMB_STORE))db.createObjectStore(THUMB_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>resolve(null);});return thumbDbPromise;}
function thumbKey(m){return String(m.id)+'|'+String(m.modifiedTime||m.updatedAt||m.size||'v1');}
async function getSavedThumb(m){const db=await openThumbDb();if(!db)return null;return new Promise(resolve=>{try{const r=db.transaction(THUMB_STORE,'readonly').objectStore(THUMB_STORE).get(thumbKey(m));r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>resolve(null)}catch(e){resolve(null)}})}
async function saveThumb(m,blob){const db=await openThumbDb();if(!db||!blob)return;try{db.transaction(THUMB_STORE,'readwrite').objectStore(THUMB_STORE).put(blob,thumbKey(m))}catch(e){}}
function showSavedThumb(tile,m,blob){if(!blob||!tile.isConnected)return false;const old=tile.querySelector('.video-placeholder,.video-thumb');if(old)old.remove();const img=document.createElement('img');img.className='video-poster-cache';img.alt=m.name;img.decoding='async';img.src=URL.createObjectURL(blob);img.onload=()=>URL.revokeObjectURL(img.src);tile.insertBefore(img,tile.querySelector('.tag'));tile.dataset.thumbCached='1';return true;}
async function captureVideoThumb(m,v,tile){if(v.dataset.thumbSaved==='1'||!v.videoWidth||!v.videoHeight)return;v.dataset.thumbSaved='1';try{const c=document.createElement('canvas');const max=640,scale=Math.min(1,max/Math.max(v.videoWidth,v.videoHeight));c.width=Math.max(1,Math.round(v.videoWidth*scale));c.height=Math.max(1,Math.round(v.videoHeight*scale));const ctx=c.getContext('2d');ctx.drawImage(v,0,0,c.width,c.height);const blob=await new Promise(resolve=>c.toBlob(resolve,'image/jpeg',0.78));if(blob){await saveThumb(m,blob);if(tile?.isConnected&&tile.dataset.thumbCached!=='1')showSavedThumb(tile,m,blob)}c.width=0;c.height=0;}catch(e){v.dataset.thumbSaved='0';}}
const MAX_THUMB_LOADS=2;
let thumbObserver=null;
function mediaUrl(m){return API+'/media/'+encodeURIComponent(m.id)}
function makePlaceholder(){const el=document.createElement('div');el.className='video-placeholder';el.textContent='▶';return el}
function startThumbQueue(){
  while(activeThumbLoads<MAX_THUMB_LOADS&&thumbQueue.length){
    const task=thumbQueue.shift();
    if(!task.tile.isConnected||task.video.dataset.thumbQueued!=='1')continue;
    activeThumbLoads++;
    const v=task.video;v.dataset.thumbQueued='0';v.dataset.thumbLoading='1';
    const finish=()=>{if(v.dataset.thumbLoading==='1'){v.dataset.thumbLoading='0';activeThumbLoads=Math.max(0,activeThumbLoads-1);startThumbQueue()}};
    v.addEventListener('loadeddata',finish,{once:true});
    v.addEventListener('seeked',()=>captureVideoThumb(task.media,v,task.tile),{once:true});
    v.addEventListener('error',finish,{once:true});
    v.addEventListener('loadedmetadata',()=>{if(v.dataset.seekThumb!=='1'){v.dataset.seekThumb='1';try{v.currentTime=Math.min(.12,Math.max(0,(v.duration||1)/30))}catch(e){}}},{once:true});
    v.preload='metadata';
    if(!v.src){v.src=mediaUrl(task.media);v.load()}
    else v.load();
    task.tile.querySelector('.video-placeholder')?.classList.add('loading');
  }
}
async function queueThumb(m,tile){
  if(!m||!tile||tile.dataset.thumbRequested==='1')return;
  tile.dataset.thumbRequested='1';
  const saved=await getSavedThumb(m);
  if(saved&&showSavedThumb(tile,m,saved))return;
  const v=ensureVideoReady(m,false);
  v.controls=false;v.autoplay=false;v.muted=true;v.playsInline=true;
  if(v.parentElement!==tile)tile.insertBefore(v,tile.querySelector('.tag'));
  tile.querySelector('.video-placeholder')?.remove();
  if(v.readyState>=2)return;
  if(v.dataset.thumbQueued==='1'||v.dataset.thumbLoading==='1')return;
  v.dataset.thumbQueued='1';thumbQueue.push({media:m,tile,video:v});startThumbQueue();
}
function ensureVideoReady(m,priority=false){
  if(!m||m.mediaType!=='video')return null;
  let v=preloaded.get(m.id);
  if(!v){
    v=document.createElement('video');v.className='video-thumb';v.preload='none';v.muted=true;v.playsInline=true;v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');v.dataset.mediaId=m.id;
    preloaded.set(m.id,v);
  }
  if(priority){
    v.preload='auto';
    if(!v.src){v.src=mediaUrl(m);v.load()}else if(v.readyState<2){try{v.load()}catch(e){}}
  }
  return v;
}
function render(){
  const a=filtered();
  $('grid').innerHTML=a.map((m,i)=>{
    if(m.mediaType==='photo')return `<div class="tile" data-i="${i}"><img loading="lazy" decoding="async" src="${mediaUrl(m)}" alt="${esc(m.name)}"></div>`;
    const poster=posterFor(m);
    return `<div class="tile" data-i="${i}" data-media-id="${esc(m.id)}">${poster?`<img loading="lazy" decoding="async" src="${mediaUrl(poster)}" alt="${esc(m.name)}">`:'<div class="video-placeholder">▶</div>'}<span class="tag">▶ 影片</span></div>`;
  }).join('');
  $('empty').hidden=a.length>0;
  if(thumbObserver)thumbObserver.disconnect();
  thumbObserver=new IntersectionObserver(entries=>{
    for(const entry of entries){if(!entry.isIntersecting)continue;
      const tile=entry.target;const m=a[Number(tile.dataset.i)];
      if(m?.mediaType==='video'&&!posterFor(m)){queueThumb(m,tile);thumbObserver.unobserve(tile)}
    }
  },{rootMargin:'900px 0px',threshold:0.01});
  $('grid').querySelectorAll('.tile').forEach(el=>{
    const m=a[Number(el.dataset.i)];
    if(m?.mediaType==='video'&&!posterFor(m))thumbObserver.observe(el);
    el.addEventListener('pointerdown',()=>{if(m?.mediaType==='video'){const v=ensureVideoReady(m,true);if(v.parentElement!==el&&!posterFor(m))el.insertBefore(v,el.querySelector('.tag'));}},{passive:true});
    el.addEventListener('click',()=>openViewer(Number(el.dataset.i)));
  });
}
function returnVideoToTile(m){
  if(!m)return;
  const v=preloaded.get(m.id);
  const tile=[...$('grid').querySelectorAll('.tile')].find(el=>el.dataset.mediaId===String(m.id));
  if(v&&tile){v.pause();v.onended=null;v.muted=true;v.controls=false;v.autoplay=false;tile.appendChild(v);}
  else if(v){v.pause();v.onended=null;v.muted=true;$('preloadBin').appendChild(v);}
}
function warmAround(i){
  const a=filtered();if(!a.length)return;
  // 只預熱下一個影片的少量播放資料，不在相簿初次載入時下載大量影片內容。
  for(let step=0;step<Math.min(a.length,3);step++){
    const m=a[(i+step)%a.length];
    if(m.mediaType==='video'){
      const v=ensureVideoReady(m,false);
      if(v.preload==='none')v.preload='metadata';
      if(!v.src){v.src=mediaUrl(m);try{v.load()}catch(e){}}
      break;
    }
  }
}
function openViewer(i){let a=filtered();if(!a.length)return;index=i;warmAround(index);showItem()}
function showItem(){
  let a=filtered(),m=a[index];if(!m)return;
  const stage=$('stage');stage.innerHTML='';
  if(m.mediaType==='photo'){
    const img=document.createElement('img');img.alt=m.name;img.src=mediaUrl(m);stage.appendChild(img);
  }else{
    const v=ensureVideoReady(m,true);
    v.controls=true;v.autoplay=true;v.muted=false;v.preload='auto';
    v.style.maxWidth='100vw';v.style.maxHeight='100dvh';v.style.width='auto';v.style.height='auto';v.style.objectFit='contain';
    stage.appendChild(v);
    // 點擊開啟本身是使用者手勢，直接要求播放；資料未到齊時由瀏覽器持續緩衝。
    const playNow=()=>{const p=v.play();if(p&&p.catch)p.catch(()=>{v.muted=true;v.play().catch(()=>{});});};
    playNow();
    v.onended=()=>move(1);
  }
  $('viewer').classList.add('show');
  warmAround((index+1)%a.length);
}
function move(n){let a=filtered();if(!a.length)return;const old=a[index];if(old&&old.mediaType==='video')returnVideoToTile(old);index=(index+n+a.length)%a.length;warmAround(index);showItem()}
$('close').onclick=()=>{$('viewer').classList.remove('show');const a=filtered(),m=a[index];if(m&&m.mediaType==='video')returnVideoToTile(m);$('stage').innerHTML='';warmAround(index)};
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
document.addEventListener('keydown',e=>{if(!$('viewer').classList.contains('show'))return;if(e.key==='Escape')$('close').click();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
$('folder').onchange=()=>{if(thumbObserver)thumbObserver.disconnect();thumbQueue.length=0;activeThumbLoads=0;for(const v of preloaded.values()){v.pause();v.removeAttribute('src');v.load()}preloaded.clear();render();warmAround(0)};
$('uploadBtn').onclick=async()=>{const files=[...$('files').files];if(!files.length){$('status').textContent='請先選擇照片或影片';return}let folderId=$('folder').value||folders[0]?.id;if(!folderId){$('status').textContent='目前沒有可上傳的資料夾';return}let key=sessionStorage.getItem('albumUploadKey')||prompt('請輸入上傳專用授權碼（觀看相簿不需要此碼）');if(!key)return;sessionStorage.setItem('albumUploadKey',key);for(let i=0;i<files.length;i++){let f=files[i];$('status').textContent=`正在上傳 ${i+1}/${files.length}：${f.name}`;try{let r=await fetch(API+'/upload',{method:'POST',headers:{'Content-Type':f.type,'X-Album-Upload-Key':key,'X-Album-Folder-Id':folderId,'X-Album-File-Name':encodeURIComponent(f.name)},body:f});let d=await r.json();if(!r.ok)throw Error(d.error||r.status)}catch(e){$('status').textContent=`${f.name} 上傳失敗：${e.message}`;return}}$('status').textContent='上傳完成，正在更新回憶…';$('files').value='';await load();$('status').textContent='全部上傳完成'};
window.addEventListener('pagehide',()=>{for(const v of preloaded.values())v.pause()});load();setInterval(load,60000);
</script></body></html>
