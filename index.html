<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dceaf0">
  <meta name="description" content="四段旅程，一個慢慢展開的故事。">
  <title>四段旅程・一個故事</title>
  <link rel="preload" as="image" href="assets/images/chapter-01.png" fetchpriority="high">
  <style>
    * { box-sizing: border-box; }
    html, body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      -webkit-text-size-adjust: 100%;
    }
    body { overscroll-behavior: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      overflow: hidden;
      background: #000;
    }
    .track {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }
    .track::-webkit-scrollbar { display: none; }
    .chapter {
      position: relative;
      isolation: isolate;
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      min-width: 0;
      overflow: hidden;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: #111;
    }
    .chapter[hidden] { display: none !important; }

    /*
      滿版呈現策略：
      背景層放大鋪滿整個螢幕，避免任何空白；
      前景照片使用 contain，完整顯示原圖、不裁切、不拉伸。
      背景只是同一張照片的柔焦延伸，不會改動原圖內容。
    */
    .chapter::before {
      content: "";
      position: absolute;
      z-index: 0;
      inset: -24px;
      background-image: var(--chapter-background);
      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
      filter: blur(24px) brightness(.78);
      transform: scale(1.04);
      opacity: 0;
      transition: opacity .35s ease;
      pointer-events: none;
    }
    .chapter:has(.chapter-image.is-loaded)::before { opacity: 1; }

    .chapter-image {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
      opacity: 0;
      transition: opacity .35s ease;
    }
    .chapter-image.is-loaded { opacity: 1; }
    .chapter-button {
      position: absolute;
      z-index: 2;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -42%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 152px;
      min-height: 50px;
      padding: 0 24px;
      border: 1px solid rgba(255,255,255,.96);
      border-radius: 999px;
      background: rgba(255, 250, 241, .94);
      color: #594b40;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .08em;
      text-decoration: none;
      box-shadow: 0 5px 20px rgba(45, 46, 42, .2);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      touch-action: manipulation;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translate(-50%, -42%);
    }
    .chapter-button.is-ready {
      visibility: visible;
      pointer-events: auto;
      animation: button-fade-in .9s ease-out both;
    }
    @keyframes button-fade-in {
      from { opacity: 0; transform: translate(-50%, -42%); }
      to { opacity: 1; transform: translate(-50%, -50%); }
    }
    .chapter-button:active { background: rgba(255,255,255,.99); transform: translate(-50%, -50%) scale(.97); }
    .chapter-button:focus-visible { outline: 3px solid rgba(78,116,151,.85); outline-offset: 4px; }
    @media (prefers-reduced-motion: reduce) {
      .chapter-image { transition: none; }
      .chapter-button.is-ready { animation-duration: .01ms; }
      .track { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="四段旅程，一個故事">
    <div class="track" id="track" aria-label="左右滑動瀏覽故事章節">
      <section class="chapter" data-chapter="first" aria-label="第一章：初次的風景">
        <img class="chapter-image" src="assets/images/chapter-01.png" alt="第一章插畫：初次的風景" fetchpriority="high" decoding="async" draggable="false">
        <a class="chapter-button" data-link="memories" href="memories/index.html">回憶相簿</a>
      </section>

      <section class="chapter" data-chapter="second" aria-label="第二章：意外的轉彎">
        <img class="chapter-image" src="assets/images/chapter-02.png" alt="第二章插畫：意外的轉彎" loading="eager" decoding="async" draggable="false">
        <a class="chapter-button" data-link="second" href="chapters/chapter-02.html">開始旅程</a>
      </section>

      <section class="chapter" data-chapter="third" aria-label="第三章：更熟悉的時間" hidden>
        <img class="chapter-image" src="assets/images/chapter-03.png" alt="第三章插畫：更熟悉的時間" loading="lazy" decoding="async" draggable="false">
        <a class="chapter-button" data-link="third" href="chapters/chapter-03.html">開始旅程</a>
      </section>

      <section class="chapter" data-chapter="fourth" aria-label="第四章：下一段旅程" hidden>
        <img class="chapter-image" src="assets/images/chapter-04.png" alt="第四章插畫：下一段旅程" loading="lazy" decoding="async" draggable="false">
        <a class="chapter-button" data-link="fourth" href="chapters/chapter-04.html">開始旅程</a>
      </section>
    </div>
  </main>

  <script>
    /*
      一、章節顯示設定：
      true = 顯示該章；false = 暫時隱藏。
      目前第三、第四章隱藏。
      注意：這只是前端顯示控制，不是私密內容的存取權限保護。

      二、按鈕網址集中在 CHAPTER_LINKS。
      等你建立各個網頁後，只要修改對應網址即可。
      網址以 GitHub Pages 專案根目錄為基準的相對路徑填寫。
    */
    const CHAPTER_VISIBILITY = {
      first: true,
      second: true,
      third: false,
      fourth: false
    };

    const CHAPTER_LINKS = {
      memories: "memories/index.html",
      second: "chapters/chapter-02.html",
      third: "chapters/chapter-03.html",
      fourth: "chapters/chapter-04.html"
    };

    document.querySelectorAll(".chapter").forEach(section => {
      const key = section.dataset.chapter;
      section.hidden = CHAPTER_VISIBILITY[key] !== true;
    });

    document.querySelectorAll(".chapter-button").forEach(link => {
      const key = link.dataset.link;
      if (CHAPTER_LINKS[key]) link.href = CHAPTER_LINKS[key];
    });

    const track = document.getElementById("track");
    const images = [...document.querySelectorAll(".chapter-image")];

    // 用同一張原圖延伸背景，確保螢幕四邊都有畫面；前景仍完整保留原圖比例。
    images.forEach(image => {
      image.parentElement.style.setProperty(
        "--chapter-background",
        `url("${image.getAttribute("src")}")`
      );
    });

    function markLoaded(image) {
      if (image.classList.contains("is-loaded")) return;
      image.classList.add("is-loaded");
      const button = image.parentElement.querySelector(".chapter-button");
      if (button) {
        // 等圖片先完成顯示，再於後續影格啟動淡入動畫，避免快速載入時動畫被跳過。
        requestAnimationFrame(() => {
          requestAnimationFrame(() => button.classList.add("is-ready"));
        });
      }
    }

    images.forEach((image) => {
      image.addEventListener("load", () => markLoaded(image), { once: true });
      if (image.complete && image.naturalWidth > 0) markLoaded(image);

      image.addEventListener("error", () => {
        image.alt = "圖片無法載入，請確認 assets/images/ 中的檔名與路徑。";
      }, { once: true });
    });

    // 預載下一張，提升滑動後的顯示速度；第三、四章隱藏時不會主動下載。
    function preloadNextVisibleImage() {
      const width = track.clientWidth || window.innerWidth;
      const currentIndex = Math.max(0, Math.round(track.scrollLeft / width));
      const next = images.slice(currentIndex + 1).find(img => !img.closest(".chapter").hidden);
      if (next && !next.complete) {
        const preload = new Image();
        preload.decoding = "async";
        preload.src = next.currentSrc || next.src;
      }
    }
    track.addEventListener("scroll", () => {
      window.requestAnimationFrame(preloadNextVisibleImage);
    }, { passive: true });
  </script>
</body>
</html>
