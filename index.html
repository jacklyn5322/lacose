<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#dceaf0">
  <title>四段旅程，一個故事</title>
  <style>
    :root { --safe-bottom: env(safe-area-inset-bottom, 0px); }
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #dceaf0;
      -webkit-text-size-adjust: 100%;
    }
    body { overscroll-behavior: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    .app {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      height: 100dvh;
      overflow: hidden;
      background: transparent;
    }
    .track {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }
    .track::-webkit-scrollbar { display: none; }
    .chapter {
      position: relative;
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      min-width: 0;
      overflow: hidden;
      scroll-snap-align: start;
      scroll-snap-stop: always;
      background: transparent;
    }
    .chapter[hidden] { display: none !important; }
    .chapter-image {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
    }
    .chapter-button {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: calc(22px + var(--safe-bottom));
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 148px;
      min-height: 48px;
      padding: 0 24px;
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 999px;
      background: rgba(255, 250, 241, .92);
      color: #594b40;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .08em;
      text-decoration: none;
      box-shadow: 0 4px 18px rgba(45, 46, 42, .16);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      cursor: pointer;
      touch-action: manipulation;
      transition: transform .18s ease, background .18s ease;
    }
    .chapter-button:active {
      transform: translateX(-50%) scale(.97);
      background: rgba(255, 255, 255, .98);
    }
    .chapter-button:focus-visible {
      outline: 3px solid rgba(78, 116, 151, .8);
      outline-offset: 4px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    @media (prefers-reduced-motion: reduce) {
      .track { scroll-behavior: auto; }
      .chapter-button { transition: none; }
    }
  </style>
</head>
<body>
  <main class="app" aria-label="四段旅程，一個故事">
    <div class="track" id="track" aria-label="左右滑動瀏覽故事章節">
      <section class="chapter" data-chapter="first" aria-label="第一章：初次的風景">
        <img class="chapter-image" src="assets/images/chapter-01.png" alt="第一章插畫：初次的風景" draggable="false">
        <a class="chapter-button" href="memories/index.html">回憶相簿</a>
      </section>

      <section class="chapter" data-chapter="second" aria-label="第二章：意外的轉彎">
        <img class="chapter-image" src="assets/images/chapter-02.png" alt="第二章插畫：意外的轉彎" draggable="false">
        <a class="chapter-button" href="chapters/chapter-02.html">開始旅程</a>
      </section>

      <section class="chapter" data-chapter="third" aria-label="第三章：更熟悉的時間" hidden>
        <img class="chapter-image" src="assets/images/chapter-03.png" alt="第三章插畫：更熟悉的時間" draggable="false">
        <a class="chapter-button" href="chapters/chapter-03.html">開始旅程</a>
      </section>

      <section class="chapter" data-chapter="fourth" aria-label="第四章：下一段旅程" hidden>
        <img class="chapter-image" src="assets/images/chapter-04.png" alt="第四章插畫：下一段旅程" draggable="false">
        <a class="chapter-button" href="chapters/chapter-04.html">開始旅程</a>
      </section>
    </div>
  </main>

  <script>
    /*
      章節顯示開關：
      true  = 章節會出現在首頁，可以左右滑到。
      false = 章節暫時隱藏。
      目前第一、二章顯示；第三、四章先預留並隱藏。
      這是前端顯示控制，不是機密內容的存取權限保護。
    */
    const CHAPTER_VISIBILITY = {
      first: true,
      second: true,
      third: false,
      fourth: false
    };

    document.querySelectorAll(".chapter").forEach(section => {
      const key = section.dataset.chapter;
      section.hidden = CHAPTER_VISIBILITY[key] !== true;
    });

    // 防止拖曳圖片時選取或拖出圖片，保留自然的觸控左右滑動。
    document.querySelectorAll(".chapter-image").forEach(image => {
      image.addEventListener("dragstart", event => event.preventDefault());
      image.addEventListener("error", () => {
        image.alt = "插畫無法載入，請確認 assets/images/ 中的圖片檔名與路徑。";
      });
    });
  </script>
</body>
</html>
